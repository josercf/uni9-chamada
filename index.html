<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Presença · Uninove</title>
<style>
  :root{
    --marinho:#202377;
    --vermelho:#f34c4c;
    --tinta:#1b1c30;
    --suave:#6b6f8a;
    --linha:#e3e5ee;
    --fundo:#f6f7fb;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--fundo); color:var(--tinta);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; padding:0 20px 40px;
  }
  .app{width:100%; max-width:420px}

  .marca{display:flex; align-items:center; gap:10px; padding:28px 2px 22px}
  .marca .nome{font-size:15px; font-weight:700; letter-spacing:.14em; color:var(--marinho)}
  .pontos{display:flex; gap:3px}
  .pontos i{width:7px; height:7px; background:var(--vermelho); border-radius:1px; display:block}

  .cartao{background:#fff; border:1px solid var(--linha); border-radius:14px; padding:26px 22px 24px}
  h1{margin:0 0 6px; font-size:23px; font-weight:650; letter-spacing:-.02em}
  .sub{margin:0 0 26px; font-size:14px; line-height:1.5; color:var(--suave)}

  label{display:block; font-size:12px; font-weight:600; letter-spacing:.06em;
        text-transform:uppercase; color:var(--suave); margin:0 0 7px}
  .campo{margin-bottom:20px}
  input{
    width:100%; padding:14px 15px; font-size:17px; font-family:inherit;
    border:1.5px solid var(--linha); border-radius:10px; background:#fff; color:var(--tinta);
    transition:border-color .15s;
  }
  input::placeholder{color:#b9bccd}
  input:focus{outline:none; border-color:var(--marinho)}
  #otp{font-size:30px; font-weight:650; letter-spacing:.42em; text-align:center; padding-left:.42em}

  button{
    width:100%; padding:15px; font-size:16px; font-weight:650; font-family:inherit;
    border:none; border-radius:10px; background:var(--vermelho); color:#fff; cursor:pointer;
    transition:opacity .15s;
  }
  button:active{opacity:.85}
  button:disabled{opacity:.45; cursor:default}

  .msg{margin-top:18px; padding:15px 16px; border-radius:10px; font-size:15px; line-height:1.45; display:none}
  .ok{background:#eef7f1; color:#14663f; border:1px solid #cfe7da}
  .ok strong{display:block; font-size:17px; margin-bottom:2px}
  .err{background:#fdeeee; color:#a32020; border:1px solid #f6d5d5}

  .nota{margin:22px 2px 0; font-size:11.5px; line-height:1.6; color:#9599b0}
  .nota b{color:var(--suave); font-weight:600}
</style>
</head>
<body>
  <div class="app">

    <div class="marca">
      <span class="nome">UNINOVE</span>
      <span class="pontos"><i></i><i></i><i></i><i></i><i></i></span>
    </div>

    <div class="cartao">
      <h1>Registrar presença</h1>
      <p class="sub">Informe o seu RA e o código exibido na tela da sala.</p>

      <div class="campo">
        <label for="mat">Seu RA</label>
        <input id="mat" type="tel" inputmode="numeric" autocomplete="off" placeholder="926105102">
      </div>

      <div class="campo">
        <label for="otp">Código da tela</label>
        <input id="otp" type="tel" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000">
      </div>

      <button id="btn">Confirmar presença</button>
      <div id="msg" class="msg"></div>
    </div>

    <p class="nota">
      <b>Sobre seus dados.</b> Ao confirmar, registramos data, hora, RA, endereço de rede, navegador e,
      se você autorizar, a localização aproximada. Servem apenas para validar a presença desta aula
      e ficam restritos ao professor.
    </p>

  </div>

<script src="config.js"></script>
<script>
  var CFG = window.CHAMADA_CONFIG || {};
  var btn = document.getElementById("btn");
  var msg = document.getElementById("msg");
  var campoRA = document.getElementById("mat");
  var campoOTP = document.getElementById("otp");

  var geo = { lat:"", lon:"", acc:"" };

  // pede a localizacao ja na abertura, para nao atrasar o envio
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(p){
      geo.lat = p.coords.latitude.toFixed(6);
      geo.lon = p.coords.longitude.toFixed(6);
      geo.acc = Math.round(p.coords.accuracy);
    }, function(){}, { enableHighAccuracy:true, timeout:8000, maximumAge:60000 });
  }

  // identificador do aparelho: estavel por navegador, sem dado pessoal
  function fingerprint() {
    var id = "";
    try { id = localStorage.getItem("chamada_fp") || ""; } catch(e) {}
    if (!id) {
      id = "fp_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
      try { localStorage.setItem("chamada_fp", id); } catch(e) {}
    }
    var tela = (screen.width + "x" + screen.height);
    return id + "|" + tela;
  }

  function mostra(html, tipo) {
    msg.innerHTML = html;
    msg.className = "msg " + tipo;
    msg.style.display = "block";
  }

  function enviar() {
    var ra = campoRA.value.trim();
    var otp = campoOTP.value.trim();
    if (!ra) { mostra("Informe o seu RA.", "err"); return; }
    if (otp.length < 4) { mostra("Informe o código da tela (6 dígitos).", "err"); return; }
    if (!CFG.WEBHOOK_BASE || CFG.WEBHOOK_BASE.indexOf("SEU-SUBDOMINIO") >= 0) {
      mostra("Sistema ainda não configurado. Avise o professor.", "err"); return;
    }

    btn.disabled = true; btn.textContent = "Enviando...";

    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch(e) {}

    var corpo =
      "ra=" + encodeURIComponent(ra) +
      "&otp=" + encodeURIComponent(otp) +
      "&lat=" + encodeURIComponent(geo.lat) +
      "&lon=" + encodeURIComponent(geo.lon) +
      "&acc=" + encodeURIComponent(geo.acc) +
      "&tz=" + encodeURIComponent(tz) +
      "&fp=" + encodeURIComponent(fingerprint());

    fetch(CFG.WEBHOOK_BASE + "/presenca", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: corpo
    })
    .then(function(r){ return r.json().catch(function(){ return { ok:false, msg:"Resposta inválida do servidor." }; }); })
    .then(function(r){
      btn.disabled = false; btn.textContent = "Confirmar presença";
      if (r && r.ok) {
        var nome = (r.nome || "").trim();
        var saudacao = nome ? ("Tudo certo, " + nome + "!") : "Tudo certo!";
        mostra("<strong>" + saudacao + "</strong>" + (r.msg || "Presença registrada."), "ok");
        campoOTP.value = "";
      } else {
        mostra((r && r.msg) || "Não foi possível registrar.", "err");
      }
    })
    .catch(function(){
      btn.disabled = false; btn.textContent = "Confirmar presença";
      mostra("Erro de conexão. Tente de novo.", "err");
    });
  }

  btn.addEventListener("click", enviar);
  campoOTP.addEventListener("keyup", function(e){ if (e.key === "Enter") enviar(); });
</script>
</body>
</html>
