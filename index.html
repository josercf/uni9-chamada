<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Registrar presenca</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
         background:#0f172a; color:#e2e8f0; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
  .card { background:#1e293b; border-radius:18px; padding:26px 22px; width:100%; max-width:400px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#94a3b8; font-size:13px; margin:0 0 22px; }
  label { display:block; font-size:13px; margin:14px 0 6px; color:#cbd5e1; }
  input { width:100%; padding:15px 14px; font-size:20px; border-radius:12px; border:1px solid #334155;
          background:#0f172a; color:#fff; text-align:center; letter-spacing:2px; }
  input:focus { outline:none; border-color:#38bdf8; }
  #otp { font-size:30px; letter-spacing:8px; font-weight:700; }
  button { width:100%; margin-top:22px; padding:16px; font-size:18px; font-weight:700; border:none;
           border-radius:12px; background:#22c55e; color:#052e16; cursor:pointer; }
  button:disabled { opacity:.5; }
  .msg { margin-top:18px; padding:14px; border-radius:12px; font-size:15px; text-align:center; display:none; }
  .ok { background:#052e16; color:#86efac; border:1px solid #16a34a; }
  .err { background:#450a0a; color:#fca5a5; border:1px solid #dc2626; }
  .foot { margin-top:18px; font-size:11px; color:#64748b; text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <h1>Registrar presenca</h1>
    <p class="sub">Digite o seu RA e o codigo que aparece na tela da sala.</p>

    <label for="mat">RA (registro academico)</label>
    <input id="mat" type="tel" inputmode="numeric" autocomplete="off" placeholder="926105102">

    <label for="otp">Codigo da tela</label>
    <input id="otp" type="tel" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000">

    <button id="btn">Confirmar presenca</button>
    <div id="msg" class="msg"></div>
    <div class="foot">O codigo muda a cada 30 segundos.</div>
  </div>

<script src="config.js"></script>
<script>
  var CFG = window.CHAMADA_CONFIG || {};
  var btn = document.getElementById("btn");
  var msg = document.getElementById("msg");

  function mostra(texto, tipo) {
    msg.textContent = texto;
    msg.className = "msg " + tipo;
    msg.style.display = "block";
  }

  function enviar() {
    var mat = document.getElementById("mat").value.trim();
    var otp = document.getElementById("otp").value.trim();
    if (!mat) { mostra("Digite o seu RA.", "err"); return; }
    if (otp.length < 4) { mostra("Digite o codigo da tela (6 digitos).", "err"); return; }
    if (!CFG.WEBHOOK_BASE || CFG.WEBHOOK_BASE.indexOf("SEU-SUBDOMINIO") >= 0) {
      mostra("Sistema ainda nao configurado. Avise o professor.", "err"); return;
    }

    btn.disabled = true; btn.textContent = "Enviando...";

    // form-urlencoded evita preflight de CORS (requisicao simples)
    var corpo = "ra=" + encodeURIComponent(mat) + "&otp=" + encodeURIComponent(otp);

    fetch(CFG.WEBHOOK_BASE + "/presenca", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: corpo
    })
    .then(function(r){ return r.json().catch(function(){ return { ok:false, msg:"Resposta invalida do servidor." }; }); })
    .then(function(r){
      btn.disabled = false; btn.textContent = "Confirmar presenca";
      if (r && r.ok) {
        mostra(r.msg || "Presenca registrada!", "ok");
        document.getElementById("otp").value = "";
      } else {
        mostra((r && r.msg) || "Nao foi possivel registrar.", "err");
      }
    })
    .catch(function(){
      btn.disabled = false; btn.textContent = "Confirmar presenca";
      mostra("Erro de conexao. Tente de novo.", "err");
    });
  }

  btn.addEventListener("click", enviar);
  document.getElementById("otp").addEventListener("keyup", function(e){ if (e.key === "Enter") enviar(); });
</script>
</body>
</html>
